<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWT Practical File Index</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Document Layout Replication Styles */
        .doc-page {
            background-color: #ffffff;
            color: #000000;
            padding: 40px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 850px;
            margin: 20px auto;
            font-family: 'Times New Roman', Times, serif;
        }
        .doc-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
            text-transform: uppercase;
        }
        .meta-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .meta-table td {
            border: 1px solid #000000;
            width: 50%;
            padding: 15px;
            vertical-align: top;
            font-size: 1.05rem;
            line-height: 1.5;
        }
        .doc-subtitle {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 25px 0;
            line-height: 1.4;
        }
        .doc-index-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .academic-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .academic-table th, .academic-table td {
            border: 1px solid #000000;
            padding: 10px;
            font-size: 1rem;
            text-align: left;
        }
        .academic-table th {
            background-color: #f2f2f2;
            text-align: center;
            font-weight: bold;
        }
        .center-text {
            text-align: center;
        }
        .link-btn {
            color: #0000ee;
            text-decoration: none;
            font-weight: bold;
        }
        .link-btn:hover {
            text-decoration: underline;
        }
        /* Custom footer branding inside doc */
        .doc-footer {
            margin-top: 40px;
            border-top: 1px double #000;
            padding-top: 10px;
            font-size: 0.8rem;
            color: #555;
            text-align: center;
        }
    </style>
</head>
